[project]
name = "kakao-mcp"
version = "0.1.0"
description = "Personal KakaoTalk MCP server for macOS: read via kakaocli (local DB), gated send via kmsg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
kakao-mcp = "kakao_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
